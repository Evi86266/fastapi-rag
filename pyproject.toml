[project]
name = "fastapi-rag"
version = "0.1.0"
description = "FastAPI 中文文档问答助手"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "langgraph",
    "loguru",
    "pydantic",
    "pydantic-settings",
    "uvicorn",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "pymilvus==2.4.15",
    "torch==2.6.0",
    "FlagEmbedding==1.3.5",
    "transformers==4.51.3",
    "peft==0.15.2",
    "sentence-transformers==3.4.1",
    "setuptools==80.9.0",
    "psutil==7.2.2",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv]
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
